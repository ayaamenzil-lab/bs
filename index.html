    <style>
        /* Custom Font Injection */
        /* latin-ext */
        @font-face {
          font-family: 'Lilita One';
          font-style: normal;
          font-weight: 400;
          font-display: swap;
          src: url(s/lilitaone/v17/i7dPIFZ9Zz-WBtRtedDbYE98RWq7.woff2) format('woff2');
        }
        /* latin */
        @font-face {
          font-family: 'Lilita One';
          font-style: normal;
          font-weight: 400;
          font-display: swap;
          src: url(s/lilitaone/v17/i7dPIFZ9Zz-WBtRtedDbYEF8RQ.woff2) format('woff2');
        }

        body {
            font-family: 'Lilita One', cursive;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background-color: #0c1c49; /* Fallback */
        }

        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e3a8a;
        }
        ::-webkit-scrollbar-thumb {
            background: #fbbf24;
            border-radius: 4px;
        }

        /* --- Game Text Strokes (BOLDER STROKE, SMALLER SHADOW) --- */
        
        /* Small Stroke (Labels, small details) */
        .text-stroke-sm {
            -webkit-text-stroke: 1.25px black;
            paint-order: stroke fill;
            text-shadow: 0 0.5px 0 #000;
        }

        /* Standard Stroke (Body text, values) */
        .text-stroke {
            -webkit-text-stroke: 2.5px black;
            paint-order: stroke fill;
            text-shadow: 0 1.5px 0 #000;
        }

        /* Medium Stroke (Sub-headers, Buttons, Item Titles) */
        .text-stroke-md {
            -webkit-text-stroke: 3.5px black;
            paint-order: stroke fill;
            text-shadow: 0 2px 0 #000;
        }

        /* Thick Stroke (Main Headers) */
        .text-stroke-lg {
            -webkit-text-stroke: 5px black;
            paint-order: stroke fill;
            text-shadow: 0 2.5px 0 #000;
        }
        
        /* Desktop Scaling */
        @media (min-width: 640px) {
            .text-stroke-sm {
                -webkit-text-stroke: 1.5px black;
                text-shadow: 0 1px 0 #000;
            }
            .text-stroke {
                -webkit-text-stroke: 3px black;
                text-shadow: 0 1.75px 0 #000;
            }
            .text-stroke-md {
                -webkit-text-stroke: 4.5px black;
                text-shadow: 0 2.5px 0 #000;
            }
            .text-stroke-lg {
                -webkit-text-stroke: 7px black;
                text-shadow: 0 3.5px 0 #000;
            }
        }
    </style>

        <script>
            window.__bootErrors = [];
            window.addEventListener("error", function (event) {
                window.__bootErrors.push("Error: " + (event.message || "Unknown error"));
            });
            window.addEventListener("unhandledrejection", function (event) {
                var reason = event && event.reason;
                var text = reason && reason.message ? reason.message : String(reason || "Unknown promise rejection");
                window.__bootErrors.push("Unhandled rejection: " + text);
            });

            window.addEventListener("load", function () {
                setTimeout(function () {
                    var root = document.getElementById("root");
                    if (!root || root.childElementCount > 0) return;

                    var panel = document.createElement("div");
                    panel.style.position = "fixed";
                    panel.style.inset = "0";
                    panel.style.zIndex = "99999";
                    panel.style.overflow = "auto";
                    panel.style.background = "rgba(10, 18, 36, 0.96)";
                    panel.style.color = "#fff";
                    panel.style.fontFamily = "Segoe UI, Arial, sans-serif";
                    panel.style.padding = "24px";

                    var title = document.createElement("h2");
                    title.textContent = "App failed to render";
                    title.style.margin = "0 0 12px";

                    var hint = document.createElement("p");
                    hint.textContent = "Detected a blank root container. Details below:";
                    hint.style.margin = "0 0 12px";

                    var list = document.createElement("pre");
                    list.style.whiteSpace = "pre-wrap";
                    list.style.background = "#111827";
                    list.style.border = "1px solid #374151";
                    list.style.borderRadius = "8px";
                    list.style.padding = "12px";
                    list.textContent = (window.__bootErrors && window.__bootErrors.length)
                        ? window.__bootErrors.join("\n")
                        : "No runtime error captured. If this persists, run from a local server (http://localhost) instead of file://.";

                    panel.appendChild(title);
                    panel.appendChild(hint);
                    panel.appendChild(list);
                    document.body.appendChild(panel);
                }, 2500);
            });

            // Anti-inspect: Disable right-click context menu & DevTools shortcuts
            document.addEventListener("contextmenu", function (e) {
                e.preventDefault();
                return false;
            });
            document.addEventListener("keydown", function (e) {
                if (
                    e.key === "F12" ||
                    e.keyCode === 123 ||
                    ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === "I" || e.key === "i" || e.key === "J" || e.key === "j" || e.key === "C" || e.key === "c")) ||
                    ((e.ctrlKey || e.metaKey) && (e.key === "u" || e.key === "U" || e.key === "s" || e.key === "S"))
                ) {
                    e.preventDefault();
                    e.stopPropagation();
                    return false;
                }
            });
        </script>
